<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — CobrançaCRTV</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:14px/1.45 -apple-system, system-ui, sans-serif; background:#0f1115; color:#e8eaee }
  form { width:min(340px, calc(100vw - 32px)); background:#171a21; border:1px solid #262a33; border-radius:14px; padding:24px; display:grid; gap:12px }
  h1 { font-size:17px; margin:0 0 4px }
  label { font-size:12px; color:#8b92a0 }
  input { width:100%; box-sizing:border-box; background:#0b0d11; border:1px solid #262a33; color:#e8eaee; border-radius:8px; padding:10px; font:inherit }
  #code { letter-spacing:.3em; font-size:18px; text-align:center }
  button { background:#25d366; color:#04150a; border:0; border-radius:8px; padding:10px; font:inherit; font-weight:600; cursor:pointer }
  #err { color:#ef4444; min-height:1em; font-size:13px }
</style>
</head>
<body>
<form id="f">
  <h1>💬 CobrançaCRTV</h1>
  <div><label>Usuário</label><input name="user" autocomplete="username" required></div>
  <div><label>Senha</label><input name="password" type="password" autocomplete="current-password" required></div>
  <div id="codeBox"><label>Código do app autenticador</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required></div>
  <button>Entrar</button>
  <div id="err"></div>
</form>
<script>
fetch('/api/login-config').then((r) => r.json()).then((c) => { if (!c.totp) { codeBox.remove(); } });
f.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
  if (r.ok) location.href = '/';
  else { err.textContent = (await r.json()).error; if (f.code) { f.code.value = ''; f.code.focus(); } }
};
</script>
</body>
</html>
